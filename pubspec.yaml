name: respira_sp
description: >-
  Respira SP — painel de inteligência territorial que antecipa dias de risco
  por poluição do ar e calor extremo nas zonas de São Paulo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gerenciamento de estado
  flutter_riverpod: ^2.6.1
  # Navegação com rotas nomeadas e parâmetros
  go_router: ^14.6.2
  # Consumo de API (Open-Meteo)
  http: ^1.2.2
  # Persistência local (cache offline, ocorrências, limiares, decisões)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Gráficos dos dashboards
  fl_chart: ^0.69.2
  # Notificações locais para alertas críticos (diferencial)
  flutter_local_notifications: ^18.0.1
  # Formatação de datas em pt-BR
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
